<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATSV – Normaler Aufnahmeantrag</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .form-page { max-width: 900px; margin: 0 auto; }
    .form-card { background:#fff; border:1px solid #e7e7e7; border-radius:10px; padding:28px; box-shadow:0 3px 12px rgba(0,0,0,.05); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .field { display:flex; flex-direction:column; gap:7px; }
    .field.full { grid-column:1/-1; }
    label { font-size:14px; font-weight:700; }
    input, select, textarea { width:100%; padding:12px; border:1px solid #ccc; border-radius:7px; font:inherit; background:#fff; }
    textarea { min-height:100px; resize:vertical; }
    .section-title { margin:26px 0 16px; padding-bottom:8px; border-bottom:2px solid #c40022; font-size:18px; }
    .actions { margin-top:26px; display:flex; justify-content:space-between; gap:12px; }
    .secondary-button { border:1px solid #ccc; border-radius:8px; background:#fff; padding:13px 18px; cursor:pointer; }
    @media(max-width:700px){ .form-grid{grid-template-columns:1fr;} .field.full{grid-column:auto;} .actions{flex-direction:column;} }
  </style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="logo-placeholder">ATSV</div><div><div class="club-name">ATSV Forchheim e.V.</div><div class="app-name">Normaler Aufnahmeantrag</div></div></div></header>
<main class="content form-page">
  <p class="eyebrow">ONLINE-AUFNAHME</p><h1>Normaler Aufnahmeantrag</h1><p class="subtitle">Vorlage – die Felder und Pflichtangaben legen wir gemeinsam endgültig fest.</p>
  <form class="form-card" onsubmit="event.preventDefault(); alert('Der Antrag ist noch nicht mit der Datenbank verbunden.');">
    <h2 class="section-title">Persönliche Daten</h2>
    <div class="form-grid">
      <div class="field"><label for="vorname">Vorname *</label><input id="vorname" required></div>
      <div class="field"><label for="nachname">Nachname *</label><input id="nachname" required></div>
      <div class="field"><label for="geburt">Geburtsdatum *</label><input id="geburt" type="date" required></div>
      <div class="field"><label for="geschlecht">Geschlecht</label><select id="geschlecht"><option value="">Bitte auswählen</option><option>weiblich</option><option>männlich</option><option>divers</option></select></div>
    </div>
    <h2 class="section-title">Anschrift und Kontakt</h2>
    <div class="form-grid">
      <div class="field"><label for="strasse">Straße und Hausnummer *</label><input id="strasse" required></div>
      <div class="field"><label for="ort">PLZ und Ort *</label><input id="ort" required></div>
      <div class="field"><label for="telefon">Telefon</label><input id="telefon" type="tel"></div>
      <div class="field"><label for="email">E-Mail</label><input id="email" type="email"></div>
    </div>
    <h2 class="section-title">Vereinsdaten</h2>
    <div class="form-grid">
      <div class="field"><label for="abteilung">Abteilung / Mannschaft</label><input id="abteilung"></div>
      <div class="field"><label for="eintritt">Gewünschter Eintritt</label><input id="eintritt" type="date"></div>
      <div class="field full"><label for="hinweise">Weitere Angaben</label><textarea id="hinweise"></textarea></div>
    </div>
    <div class="actions"><button type="button" class="secondary-button" onclick="history.back()">Zurück</button><button class="primary-button" type="submit">Antrag absenden</button></div>
  </form>
</main>
</body>
</html>
