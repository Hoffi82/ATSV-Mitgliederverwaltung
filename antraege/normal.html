<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Normaler Aufnahmeantrag</title><link rel="stylesheet" href="../styles.css"><style>.form-wrap{max-width:900px;margin:35px auto}.form-box{background:#fff;border:1px solid #e7e7e7;border-radius:10px;padding:28px;box-shadow:0 3px 12px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font:inherit}textarea{min-height:90px}.section{border-top:1px solid #eee;padding-top:22px;margin-top:25px}.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}.check input{width:auto;margin-top:4px}.actions{margin-top:25px;display:flex;gap:12px}.secondary{padding:12px 18px;border:1px solid #ccc;background:#fff;border-radius:7px;text-decoration:none;color:#111}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><header class="topbar"><div class="brand"><div class="logo-placeholder">ATSV</div><div><div class="club-name">ATSV Forchheim e.V.</div><div class="app-name">Online-Aufnahmeantrag</div></div></div></header>
<main class="content form-wrap"><p class="eyebrow">ANTRAG 1</p><h1>Normaler Aufnahmeantrag</h1><p class="subtitle">Bitte alle erforderlichen Angaben vollständig ausfüllen.</p><form class="form-box" onsubmit="event.preventDefault();alert('Der Antrag ist als Entwurf erfasst. Die sichere Übermittlung wird später angebunden.');">
<div class="section" style="border-top:0;padding-top:0;margin-top:0"><h2>Persönliche Daten</h2><div class="grid"><div><label>Vorname *</label><input required></div><div><label>Nachname *</label><input required></div><div><label>Geburtsdatum *</label><input type="date" required></div><div><label>Geschlecht</label><select><option value="">Bitte auswählen</option><option>weiblich</option><option>männlich</option><option>divers</option><option>keine Angabe</option></select></div><div><label>Straße und Hausnummer *</label><input required></div><div><label>PLZ *</label><input required></div><div><label>Ort *</label><input required></div><div><label>Staatsangehörigkeit</label><input></div><div><label>Telefon</label><input type="tel"></div><div><label>E-Mail</label><input type="email"></div></div></div>
<div class="section"><h2>Vereinsdaten</h2><div class="grid"><div><label>Gewünschte Abteilung *</label><select required><option value="">Bitte auswählen</option><option>Fußball</option><option>Jugendfußball</option><option>Andere Abteilung</option></select></div><div><label>Gewünschtes Eintrittsdatum</label><input type="date"></div><div class="full"><label>Bemerkungen</label><textarea></textarea></div></div></div>
<div class="section"><h2>Erziehungsberechtigte</h2><div class="grid"><div><label>Name des Erziehungsberechtigten</label><input></div><div><label>Telefon</label><input type="tel"></div><div class="full"><label>E-Mail</label><input type="email"></div></div></div>
<div class="section"><h2>Erklärungen</h2><label class="check"><input type="checkbox" required><span>Ich bestätige, dass die Angaben vollständig und richtig sind. *</span></label><br><label class="check"><input type="checkbox" required><span>Ich stimme der Verarbeitung der für die Vereinsverwaltung erforderlichen personenbezogenen Daten nach den geltenden Datenschutzinformationen des Vereins zu. *</span></label><br><label class="check"><input type="checkbox"><span>Ich möchte Informationen des Vereins per E-Mail erhalten.</span></label></div>
<div class="actions"><button class="primary-button" type="submit">Antrag absenden</button><a class="secondary" href="index.html">Zurück</a></div></form></main></body></html>
