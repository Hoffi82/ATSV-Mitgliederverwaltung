<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATSV – Anmeldung</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="login-logo">ATSV</div>
      <p class="eyebrow">ATSV FORCHHEIM E.V.</p>
      <h1>Mitgliederverwaltung</h1>
      <p class="subtitle">Bitte mit Ihrem Verwaltungszugang anmelden.</p>

      <form id="login-form">
        <label for="username">Benutzername</label>
        <input id="username" type="text" autocomplete="username" required>

        <label for="password">Passwort</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button class="primary-button" type="submit">Anmelden</button>
        <p id="login-message" class="login-message" role="alert"></p>
      </form>
    </section>
  </main>

  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
