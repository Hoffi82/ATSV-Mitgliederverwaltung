<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ATSV – Antrag prüfen</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.detail{background:#fff;border:1px solid #ddd;border-radius:10px;padding:25px}.detail-head{display:flex;justify-content:space-between;gap:20px;align-items:start;border-bottom:1px solid #eee;padding-bottom:20px;margin-bottom:22px}.status-pill{background:#fff1f3;color:#a0001b;padding:7px 11px;border-radius:20px;font-size:12px;font-weight:700}.section{margin:25px 0}.section h2{font-size:18px;margin:0 0 15px;border-left:4px solid #c40022;padding-left:10px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{background:#f6f6f6;border-radius:7px;padding:12px}.field label{display:block;color:#777;font-size:11px;margin-bottom:4px}.field span{font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px;padding-top:20px;border-top:1px solid #eee}.action{border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer}.check{background:#eee}.approve{background:#dff3e4;color:#216a35}.reject{background:#f8e1e4;color:#8f0019}.info{background:#f7f7f7;padding:14px;border-radius:8px;color:#666;font-size:13px;line-height:1.5}.message{margin:15px 0;padding:13px;border-radius:8px;display:none}.message.error{display:block;background:#fff0f0;color:#a00020}.message.success{display:block;background:#e7f7ec;color:#18743a}.next-step{display:none;margin-top:16px;padding:15px;border-radius:8px;background:#edf7ef;border:1px solid #cfe7d3;color:#245d32}.loading{text-align:center;padding:40px;color:#777}@media(max-width:650px){.fields{grid-template-columns:1fr}.detail-head{display:block}}
</style></head>
<body><header class="topbar"><div class="brand"><div class="logo-placeholder">ATSV</div><div><div class="club-name">ATSV Forchheim e.V.</div><div class="app-name">Mitgliederverwaltung</div></div></div><div class="user-area"><button class="logout-button" onclick="logout()">Abmelden</button></div></header>
<div class="layout"><aside class="sidebar"><nav><a href="index.html">Dashboard</a><a href="mitglieder.html">Mitglieder</a><a class="active" href="aufnahmeantraege.html">Aufnahmeanträge</a><a href="#">Beiträge</a><a href="#">Dokumente</a><a href="#">Verwaltung</a></nav></aside>
<main class="content"><p><a href="aufnahmeantraege.html" style="color:#c40022;text-decoration:none;font-weight:700">← Zurück zu den Aufnahmeanträgen</a></p><div id="message" class="message"></div><div id="detail" class="detail"><div class="loading">Antrag wird geladen...</div></div></main></div>
<script src="supabase-config.js"></script><script src="auth.js"></script><script>
const id=new URLSearchParams(location.search).get('id');const detail=document.getElementById('detail'),message=document.getElementById('message');let application=null;
const labels={neu:'Neu eingegangen',in_pruefung:'In Prüfung',angenommen:'Angenommen',abgelehnt:'Abgelehnt'};
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function date(v){return v?new Date(v+'T00:00:00').toLocaleDateString('de-DE'):'—'}
function field(label,value){return `<div class="field"><label>${label}</label><span>${esc(value)}</span></div>`}
function render(){detail.innerHTML=`<div class="detail-head"><div><p class="eyebrow">ANTRAG PRÜFEN</p><h1 style="margin:0">${esc(application.first_name)} ${esc(application.last_name)}</h1><p class="subtitle">${esc(application.application_number)} · Eingang ${new Date(application.created_at).toLocaleDateString('de-DE')}</p></div><span class="status-pill">${labels[application.status]||esc(application.status)}</span></div>
<section class="section"><h2>Persönliche Daten</h2><div class="fields">${field('Vorname',application.first_name)}${field('Nachname',application.last_name)}${field('Geburtsdatum',date(application.birth_date))}${field('Geburtsort',application.birth_place)}${field('Staatsangehörigkeit',application.nationality)}${field('Geschlecht',application.gender)}</div></section>
<section class="section"><h2>Kontakt & Anschrift</h2><div class="fields">${field('Straße / Hausnummer',application.street)}${field('PLZ / Ort',(application.postal_code||'')+' '+(application.city||''))}${field('Telefon',application.phone)}${field('E-Mail',application.email)}</div></section>
<section class="section"><h2>Vereinsdaten</h2><div class="fields">${field('Gewünschte Abteilung',application.department)}${field('Gewünschtes Eintrittsdatum',date(application.desired_entry_date))}${field('Erziehungsberechtigte',application.guardian_name)}${field('Antragstyp',application.application_type==='auslaendische_kinder'?'Ausländisches Kind':'Normal')}</div></section>
<section class="section"><h2>Nachweise & Einverständnisse</h2><div class="fields">${field('Datenschutz bestätigt',application.privacy_consent?'Ja':'Nein')}${field('Nachweise / Hinweise',application.evidence_notes)}</div></section>
<div class="actions">${application.status==='neu'?'<button class="action check" onclick="changeStatus(\'in_pruefung\')">🔎 In Prüfung</button>':''}${application.status!=='angenommen'&&application.status!=='abgelehnt'?'<button class="action approve" onclick="changeStatus(\'angenommen\')">✓ Antrag annehmen</button><button class="action reject" onclick="rejectApplication()">✕ Antrag ablehnen</button>':''}</div><div class="next-step" id="nextStep"></div>`}
async function load(){if(!id){detail.innerHTML='<div class="loading">Kein Antrag ausgewählt.</div>';return}const {data,error}=await supabaseClient.from('admission_applications').select('*').eq('id',id).single();if(error){detail.innerHTML='<div class="loading">Antrag konnte nicht geladen werden.</div>';message.textContent=error.message;message.className='message error';return}application=data;render()}
async function changeStatus(status){const user=(await supabaseClient.auth.getUser()).data.user;if(!user)return;const {error}=await supabaseClient.from('admission_applications').update({status,reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error){message.textContent=error.message;message.className='message error';return}const {data}=await supabaseClient.from('admission_applications').select('*').eq('id',id).single();application=data;render();message.textContent=status==='angenommen'?'Antrag wurde angenommen. Die Mitgliedsakte wurde automatisch angelegt.':'Antrag wurde auf In Prüfung gesetzt.';message.className='message success';if(status==='angenommen'){const member=await supabaseClient.from('members').select('id,member_number').eq('application_id',id).single();if(member.data){document.getElementById('nextStep').style.display='block';document.getElementById('nextStep').textContent='✓ Mitglied angelegt: '+member.data.member_number;}}}
function rejectApplication(){const reason=prompt('Grund für die Ablehnung (optional):','');changeStatus('abgelehnt')}
requireLogin();load();
</script></body></html>
